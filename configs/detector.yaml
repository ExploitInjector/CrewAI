
data:
  cleaned_path: "data/processed/cleaned.parquet"
  corr_path: "data/processed/correlation.parquet"  # opcionális; ha nincs, töröld vagy hagyd üresen
  timestamp_col: "timestamp"
  entity_col: "user_id"
  event_col: "event_type"
