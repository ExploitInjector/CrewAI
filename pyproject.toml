[project]
name = "my_project"
version = "0.1.0"
description = "my-project using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "apscheduler>=3.11.1",
    "crewai[google-genai,tools]==1.7.2",
    "email-validator>=2.3.0",
    "fastapi>=0.127.0",
    "fastapi-sso>=0.17.0",
    "litellm>=1.75.3",
    "pandas>=2.3.3",
    "tabulate>=0.9.0",
]

[project.scripts]
my_project = "my_project.main:run"
run_crew = "my_project.main:run"
train = "my_project.main:train"
replay = "my_project.main:replay"
test = "my_project.main:test"
run_with_trigger = "my_project.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
